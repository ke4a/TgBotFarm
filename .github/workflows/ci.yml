name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Not ubuntu-latest: MongoDB 8 refuses to start on Linux kernels 6.19 to 7.0.13
    # (https://jira.mongodb.org/browse/SERVER-121912), which ubuntu-26.04 ships.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore BotFarm.sln

      - name: Build
        run: dotnet build BotFarm.sln --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test BotFarm.sln --configuration Release --no-build --verbosity normal --filter "FullyQualifiedName!~BotFarm.IntegrationTests"

      # Starts MongoDB in Docker, which the Ubuntu runner provides.
      - name: Integration tests
        run: dotnet test tests/BotFarm.IntegrationTests/BotFarm.IntegrationTests.csproj --configuration Release --no-build --verbosity normal
