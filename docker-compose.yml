

services:
  botfarm:
    image: ${DOCKER_REGISTRY-}botfarm
    container_name: app
    build:
      context: .
      dockerfile: BotFarm/Dockerfile
      target: final
      args:
        BUILD_CONFIGURATION: Release
    ports:
      - "9090:5000"
    networks:
      - botfarm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DOTNET_EnableDiagnostics=0
      # Provide real values via .env / secrets manager in production:
      - ConnectionStrings__MongoDb=${MONGODB_CONNECTION_STRING}
      - WebHookUrl=${WEBHOOK_URL}

networks:
  botfarm-network:
    driver: bridge
