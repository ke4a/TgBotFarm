

services:
  botfarm:
    image: ${DOCKER_REGISTRY-}botfarm
    container_name: app
    build:
      context: .
      dockerfile: BotFarm/Dockerfile
      target: final
      args:
        BUILD_CONFIGURATION: Release
    ports:
      - "9090:5000"
    networks:
      - botfarm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DOTNET_EnableDiagnostics=0
      # Provide real values via .env / secrets manager in production:
      - ConnectionStrings__MongoDb=${MONGODB_CONNECTION_STRING}
      - WebHookUrl=${WEBHOOK_URL}
      # Optional: fixed first-run admin setup code (min. 16 chars). If empty, a random code is logged at startup.
      - Setup__Code=${SETUP_CODE:-}
      # Optional: key uptime monitors send as "Authorization: Bearer <key>" to read /health (min. 32 chars).
      # If empty, only a signed-in admin can read /health.
      - HealthChecks__ApiKey=${HEALTH_API_KEY:-}
      # Optional: memory use in MB at which the admin is warned (default 400).
      - HealthChecks__Memory__ThresholdMb=${MEMORY_THRESHOLD_MB:-400}
      # Optional: OTLP/HTTP base URL metrics are exported to, e.g. Grafana Cloud's ".../otlp". If empty, export is off.
      - Telemetry__OtlpEndpoint=${OTLP_ENDPOINT:-}
      # Optional: OTLP export headers. They hold the Grafana Cloud token ("Authorization=Basic <base64 of instance ID:token>").
      - Telemetry__OtlpHeaders=${OTLP_HEADERS:-}
      # Optional: Grafana dashboard address the admin "Metrics" links open. If empty, no links are shown.
      - Telemetry__DashboardUrl=${GRAFANA_DASHBOARD_URL:-}
    volumes:
      # Backups, logs, temporary files and sign-in keys; kept when the container is recreated.
      - botfarm-data:/app/data

networks:
  botfarm-network:
    driver: bridge

volumes:
  botfarm-data:
