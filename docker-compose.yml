

services:
  botfarm:
    image: ${DOCKER_REGISTRY-}botfarm
    container_name: app
    build:
      context: .
      dockerfile: BotFarm/Dockerfile
      target: final
      args:
        BUILD_CONFIGURATION: Release
    ports:
      - "9090:5000"
    networks:
      - botfarm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DOTNET_EnableDiagnostics=0
      # Provide real values via .env / secrets manager in production:
      - ConnectionStrings__MongoDb=${MONGODB_CONNECTION_STRING}
      - WebHookUrl=${WEBHOOK_URL}
      # Optional: fixed first-run admin setup code (min. 16 chars). If empty, a random code is logged at startup.
      - Setup__Code=${SETUP_CODE:-}
    volumes:
      # Backups, logs, temporary files and sign-in keys; kept when the container is recreated.
      - botfarm-data:/app/data

networks:
  botfarm-network:
    driver: bridge

volumes:
  botfarm-data:
