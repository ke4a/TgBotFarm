services:
  mongodb:
    image: mongo:8.3.7
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - botfarm-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  localtunnel:
    image: ${DOCKER_REGISTRY-}localtunnel
    container_name: localtunnel
    build:
      context: .
      dockerfile: BotFarm/Dockerfile-localtunnel
    command: --local-host app --port 5000 --subdomain botfarm-webhook
    restart: unless-stopped
    networks:
      - botfarm-network
    labels:
      com.microsoft.visual-studio.project-name: ""
      com.jetbrains.rider.debug: "false"

  botfarm:
    build:
      args:
        - BUILD_CONFIGURATION=Debug
    depends_on:
      mongodb:
        condition: service_healthy
      localtunnel:
        condition: service_started
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1
      - DOTNET_EnableDiagnostics=1
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__MongoDb=mongodb://admin:admin123@mongodb:27017/BotFarmDb?authSource=admin
      - WebHookUrl=docker
      - LOCALTUNNEL_URL=https://botfarm-webhook.loca.lt
    volumes:
      - ./logs:/app/logs
      - ./backups:/app/backups

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
