# The local monitoring stack (Grafana and an OTLP receiver) starts with the rest of the development services.
include:
  - monitoring/docker-compose.yml

services:
  mongodb:
    image: mongo:8.3.11
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - botfarm-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  tunnel:
    image: ${DOCKER_REGISTRY-}tunnel
    container_name: tunnel
    build:
      context: .
      dockerfile: BotFarm/Dockerfile-tunnel
    restart: unless-stopped
    environment:
      - TUNNEL_PROVIDER=${WEBHOOK_MODE:-localtunnel}
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    networks:
      botfarm-network:
        aliases:
          - ngrok
    labels:
      com.microsoft.visual-studio.project-name: ""
      com.jetbrains.rider.debug: "false"

  botfarm:
    build:
      args:
        - BUILD_CONFIGURATION=Debug
    depends_on:
      mongodb:
        condition: service_healthy
      tunnel:
        condition: service_started
      # Started with the app even when a launcher starts only selected services.
      otel-lgtm:
        condition: service_started
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_EnableDiagnostics=1
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__MongoDb=mongodb://admin:admin123@mongodb:27017/BotFarmDb?authSource=admin
      - WebHookUrl=${WEBHOOK_MODE:-localtunnel}
      - LOCALTUNNEL_URL=https://botfarm-webhook.loca.lt
      # Metrics go to the local monitoring stack included above, through its port on the host.
      - Telemetry__OtlpEndpoint=http://host.docker.internal:4318
      - Telemetry__DashboardUrl=http://localhost:3000/d/botfarm/botfarm
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/app/data/logs
      - ./backups:/app/data/backups

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
